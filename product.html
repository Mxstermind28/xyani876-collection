r 1fr;gap:12px;margin:30px 0}.detail-list div{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}.detail-list small{display:block;color:#77768a;margin-bottom:5px}.detail-list b{font-size:13px}.product-actions{display:flex;gap:12px;flex-wrap:wrap}.product-actions .btn{border:0;cursor:pointer}.secondary{padding:16px 22px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#fff;text-decoration:none;font-weight:800;font-size:12px}.notice{padding:100px 6%;text-align:center;color:#bbb}@media(max-width:800px){.detail{grid-template-columns:1fr;gap:35px;padding-top:35px}.image-stage{min-height:420px}.product-nav{padding:14px 5%}.product-nav img{width:100px;height:48px}.detail-copy h1{font-size:44px}}</style></head><body><main class="product-page"><nav class="product-nav"><a class="back-link" href="index.html#shop">← BACK TO COLLECTION</a><a href="index.html"><img src="assets/xyani-logo.svg" alt="XYANI Collection"></a><a class="back-link" href="index.html#shop">SHOP</a></nav><section id="productDetail"><div class="notice">Loading your selection…</div></section></main><div id="toast" class="toast"></div><script src="product.js?v=20261004"></script></body></html>
