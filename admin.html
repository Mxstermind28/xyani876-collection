<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XYANI876 Store Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f7ff}.admin{max-width:1250px;margin:auto;padding:45px 5vw}.adminbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.admin h1{font:700 45px 'Playfair Display';margin:4px 0}.panel{background:#fff;padding:28px;margin:20px 0;border:1px solid #e4e6f4;border-radius:20px;box-shadow:0 12px 40px #5969cf0c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:linear-gradient(135deg,#171b39,#283461);color:#fff;padding:25px;border-radius:16px}.stat b{display:block;font:700 34px 'Playfair Display';color:#b7a7ff}.admin table{width:100%;border-collapse:collapse}.admin th,.admin td{text-align:left;padding:13px 8px;border-bottom:1px solid #eee;font-size:13px}.admin button{cursor:pointer}.pink{background:linear-gradient(135deg,#7663e1,#3984e9)!important}.danger{background:#fff;border:1px solid #ddd;padding:7px;border-radius:7px}.order-delete{background:#fff1f3;border:1px solid #ffc9d1;color:#a5142c;padding:8px 12px;border-radius:8px;font-weight:800}.status{padding:5px 8px;background:#e9e4ff;font-size:10px;font-weight:800}.product-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.product-form label{margin:0}.image-field{grid-column:1/-1;background:#f5f4ff;border:1px dashed #9b8de8;border-radius:15px;padding:18px}.image-field input{background:#fff}.preview-wrap{display:none;margin-top:14px;align-items:center;gap:15px}.preview-wrap.show{display:flex}.preview-wrap img{width:110px;height:110px;object-fit:cover;border-radius:14px;border:1px solid #ddd}.upload-note{font-size:11px;color:#69708d;font-weight:500}.product-thumb{width:48px;height:48px;object-fit:cover;border-radius:9px;vertical-align:middle;margin-right:10px;background:#ede9fe}.orders .order{border:1px solid #eee;margin:12px 0;p TORY</p><h2>Products</h2><form id="productForm" class="product-form"><label>Product name<input name="name" required></label><label>Price JMD<input name="price" type="number" min="0" required></label><label>Category<select name="category"><option>Bags</option><option>Accessories</option></select></label><label>Stock<input name="stock" type="number" min="0" required></label><label class="image-field">Product photo<input id="productImage" name="photo" type="file" accept="image/jpeg,image/png,image/webp"><span class="upload-note">Choose a JPG, PNG or WebP photo from your phone or computer. Maximum 5 MB.</span><div id="imagePreview" class="preview-wrap"><img id="previewImg" alt="Product preview"><span>Photo ready to upload ✓</span></div></label><label style="grid-column:1/-1">Or use an Image URL (optional)<input name="image" placeholder="https://..."></label><button class="btn pink" type="submit">+ ADD PRODUCT</button></form><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Category</th><th>Stock</th><th>Availability</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div></section><section class="panel orders"><p class="eyebrow">LIVE FULFILMENT</p><h2>Orders</h2><div id="orders"></div></section></div><script src="admin.js?v=20261002-orders2"></script></body></html>
